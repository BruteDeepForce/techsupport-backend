name: techsupport_mobile
description: Native Flutter mobile app for TechSupport monorepo.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  syncfusion_flutter_pdfviewer: ^28.2.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/branding/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/photos/
    - assets/mockups.png
