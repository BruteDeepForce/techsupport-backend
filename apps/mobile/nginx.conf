# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name lineerdestek.com www.lineerdestek.com;

    return 301 https://www.lineerdestek.com$request_uri;
}

# www olmayan alan adı -> www (canonical host tek olmalı)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lineerdestek.com;

    ssl_certificate     /etc/letsencrypt/live/lineerdestek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lineerdestek.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.lineerdestek.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.lineerdestek.com;

    ssl_certificate     /etc/letsencrypt/live/lineerdestek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lineerdestek.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), interest-cohort=()" always;
    add_header X-XSS-Protection "0" always;

    # Flutter uygulaması inline bootstrap ve Blob/worker kullandığı için
    # gevşek bir CSP uygulanır. 'unsafe-inline' yalnızca Flutter'ın kendi
    # bootstrap betiği içindir; uygulama kodunda eval kullanılmaz.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline' https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ── Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json application/manifest+json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Brotli (varsa) — JS/CSS/JSON yükünü ~%20 daha küçük yapar
    brotli on;
    brotli_static on;
    brotli_comp_level 6;
    brotli_types text/plain text/css text/xml text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # ── Static asset caching ────────────────────────────────────────────
    # Flutter build çıktısında dosya adlarında hash yoktur; bu yüzden
    # immutable yerine makul bir TTL kullanılır.
    location ~* \.(?:ico|css|js|json|jpg|jpeg|png|gif|svg|webp|woff2?|eot|ttf|otf|mp4|webm)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Flutter servis worker'ı her şeyi önbelleğe alır; yalnızca sürümlü
    # build dosyaları uzun süre önbelleklenir.
    location = /main.dart.js {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location = /flutter_service_worker.js {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # ── SPA routing ─────────────────────────────────────────────────────
    # Kalıcı SEO rotaları (/kvkk, /gizlilik, ...) Flutter tarafında
    # yönlendirilir; burada her şey index.html'e düşer.
    location / {
        try_files $uri $uri/ /index.html;
    }
}